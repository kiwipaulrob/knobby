blueprint:
  name: Knobby — Zigbee smart knob for Music Assistant (ZG-101ZD / Moes via Z2M)
  description: |
    Wire a Zigbee2MQTT smart knob (HOBEIAN / Moes ZG-101ZD and similar
    Tuya knobs) straight to Music Assistant with no extra software: no
    relay, no Python, no add-on, nothing to host.

    What it does:

    - Rotate for volume (~1 dB logarithmic taper), press for
      play/pause, double-press for next track, triple-press for
      previous track.
    - Bare hold favourites the current song; turn-while-held seeks
      with duration clamping.

    Setup (2 minutes):

    1. Assign the knob to its room (Settings → Devices) — room mode
       reads it from the mode select below.
    2. Create three helpers (Settings → Devices & services → Helpers,
       one set per knob): a Toggle for the seek latch, an
       input_datetime storing date AND time for the turn stamp, and
       an input_text for the position clock.
    3. Pick the speaker source: the knob's room (default), hand-picked
       players, or a group.
    4. Optionally list players the knob must never touch (TVs,
       displays) — applies in every mode.
    5. Optionally point the memory at an input_text helper, or leave
       it empty to skip.

    Every deliberate triple-press TOGGLES the knob's operation_mode
    (event<->command) instead of emitting an action — verified live
    Nov 2026 — so the blueprint watches BOTH flip directions and never
    writes the mode back (remote mode-set does not land on this
    firmware). The knob therefore speaks two vocabularies (event:
    rotate_right/rotate_left/single/double/hold; command:
    brightness_step_up/down/toggle/double/hue_move); both are mapped,
    so every gesture works in either mode.

    Event-mode press-and-turn is firmware-indistinguishable from
    volume+hold, so seek vs favourite is disambiguated by gesture
    shape: rotations while the seek latch is on seek instead of
    changing volume, and the favourite waits out the seek window to
    make sure you are not turning. Technique: press and turn (pause a
    beat first in event mode; in command mode no pause is needed).
    Residuals: the favourite lands ~2 s late; spinning the instant you
    press nudges volume for the first detent(s) before the hold
    registers; within the window after a favourite-hold, turns seek
    instead of voluming. A fast triple parses as `double` (next track)
    and may ALSO flip the mode (previous) — verify on install.

    Press-turn seeks from the knob's own position clock: the player's
    feed only refreshes position in the first seconds of each track,
    so the knob tracks it itself — anchoring its clock on fresh feed
    samples, extrapolating while playing, and re-anchoring on every
    seek, pause, and track change.

    Tested on HA 2026.10.4. Minimum version 2024.6.0 (input sections).

    Version 1.1 (Nov 2026, live-verified on hardware). Changelog: 1.1 —
    helper inputs moved out of Tuning, position clock is now standard,
    descriptions tidied. 1.0 — own position clock beats the dead feed;
    turn-stamp guards fixed (date AND time); announce speed gated to
    Piper/Wyoming.
  domain: automation
  source_url: https://github.com/kiwipaulrob/ma-fav-button/blob/main/blueprints/automation/kiwipaulrob/zg101zd_knob_ma_native.yaml
  author: kiwipaulrob
  homeassistant:
    min_version: 2024.6.0
  input:
    knob_action_topic:
      name: Knob action MQTT topic
      description: >
        The knob's MQTT action topic: zigbee2mqtt/<name>/action, using
        the name on the knob's Zigbee2MQTT device page (spaces become
        underscores, e.g. zigbee2mqtt/knob/action). Confirm on the Z2M
        device page — the Action field updates with each press. If you
        changed Z2M's base topic, use that instead.
      default: zigbee2mqtt/knob/action
      selector:
        text:
    mode_select:
      name: Knob operation-mode select
      description: >
        The Z2M operation_mode select for this knob (e.g.
        select.knob_2_operation_mode): lowercase device name, spaces to
        underscores, ending in operation_mode (a re-paired knob gains a
        _2/_3 suffix — check the Z2M device page if unsure).
        Triple-press only flips this select event<->command, so the
        blueprint fires on both flip directions and never writes it.
        The knob must be assigned to its room (Settings → Devices) for
        room mode.
      selector:
        entity:
          domain: select
    speaker_source:
      name: Which speakers can the knob control?
      description: >
        Knob's room follows the room the knob itself is assigned to
        (no extra picking). Choose players/groups to curate manually.
      default: knob_room
      selector:
        select:
          options:
            - label: Knob's room (recommended)
              value: knob_room
            - label: Choose players
              value: pick_players
            - label: Choose a group
              value: pick_group
    speaker_pick:
      name: Players
      description: >
        The MA players the knob may control, most-used first.
        Resolution is playing → remembered → this list in order. Leave
        TVs and displays out (or add them to Never-pick). Only used
        with Choose players above.
      default: []
      selector:
        entity:
          multiple: true
          reorder: true
          filter:
            - integration: music_assistant
              domain: media_player
    speaker_group:
      name: Speaker group
      description: >
        Group helper holding your MA speaker players. Only used with
        Choose a group above.
      default:
      selector:
        entity:
          domain: group
    exclude_players:
      name: Never-pick
      description: >
        Players the knob must never control — TVs, dashboard
        displays, anything shared. Applies in every mode above.
        (Music Assistant exposes some of these as players, so
        auto-discovery alone cannot exclude them.)
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: media_player
    memory_helper:
      name: Active-player memory (optional)
      description: >
        input_text holding the last-used speaker. The knob writes it
        when "Knob remembers last speaker" is on, and playback started
        outside the knob (phone, voice) is caught automatically. Leave
        empty to skip — the knob then uses the first candidate when
        idle.
      default:
      selector:
        entity:
          domain: input_text
    remember_speaker:
      name: Knob remembers last speaker (optional, off by default)
      description: >
        When on, every gesture records the speaker just used, so the
        knob finds it next time everything is idle. Needs the memory
        helper; leave off with a single speaker.
      default: false
      selector:
        boolean:
    seek_latch:
      name: Seek latch helper
      description: >
        input_boolean that arms seek mode while the knob is held — one
        per knob. Create it first (Helpers → Toggle, e.g. "Knob seek")
        and leave it off; the blueprint switches it by itself.
        Rotations while it is on seek instead of changing volume, and
        a latch stuck on by a restart self-heals after the seek window.
      selector:
        entity:
          domain: input_boolean
    last_turn_helper:
      name: Recent-turn stamp helper
      description: >
        An input_datetime the knob stamps on every rotation. A hold
        arriving just after turns was a long seek, not a new favourite
        — without this, press-and-rotate crossing the knob's ~3 s hold
        threshold favourites. Create an input_datetime and pick it
        here; empty keeps the old forward-watch-only behaviour. It MUST
        store date AND time — tick both on (date-only reads as midnight
        and silently disables this).
      default:
      selector:
        entity:
          domain: input_datetime
    position_clock:
      name: Position clock helper
      description: >
        An input_text the knob uses as its own position memory, so
        press-turn seeks land right even when the player stops reporting
        progress mid-track (Music Assistant only refreshes position in
        the first seconds of each track). The knob anchors it on fresh
        feed samples, extrapolates while playing, and re-anchors on
        every seek, pause, and track change — all by itself. Create an
        input_text helper (one per knob) and pick it here.
      selector:
        entity:
          domain: input_text
    announce_message:
      name: Announce message (optional)
      description: >
        Said aloud after a hold favourites the song. {song} and
        {artist} fill in from the track (missing names degrade
        gracefully). Clear for silence — with no voice below it stays
        silent anyway.
      default: "Added {song} by {artist} to favourites"
      selector:
        text:
    announce_voice:
      name: Announce voice (optional)
      description: Which voice says it (e.g. tts.piper). Empty = silent.
      default:
      selector:
        entity:
          domain: tts
    announce_speaker:
      name: Announce speaker (optional)
      description: >
        Which speaker says it — empty means the knob's current speaker.
        Must be a Music Assistant player (announcements go through MA
        with the chime off). Never a TV.
      default:
      selector:
        entity:
          domain: media_player
    announce_speed:
      name: Announce speed (optional)
      description: >
        How fast the confirmation is spoken (1.0 = natural pace). Only
        Piper/Wyoming voices honour it (their length_scale); other
        engines ignore it and stay chime-free.
      default: 1
      selector:
        number:
          min: 0.5
          max: 1.5
          step: 0.1
    tuning:
      name: Tuning
      icon: mdi:tune
      description: Feel and timing. Defaults suit most knobs.
      collapsed: true
      input:
        volume_db_per_detent:
          name: Volume step
          description: >
            dB per rotation detent. 1 dB multiplies/divides the level
            by ~1.122 each detent (logarithmic, matches human hearing).
          default: 1
          selector:
            number:
              min: 0.5
              max: 3
              step: 0.5
              unit_of_measurement: dB
        seek_seconds:
          name: Seek step
          description: Seconds per detent when turning while held.
          default: 10
          selector:
            number:
              min: 5
              max: 60
              step: 5
              unit_of_measurement: s
        seek_window:
          name: Hold-to-seek window
          description: >
            How long after a hold turns seek (and the favourite waits to
            make sure you are not turning). Longer forgives
            pause-then-turn; the favourite lands this much later.
          default:
            hours: 0
            minutes: 0
            seconds: 2
          selector:
            duration:
              enable_day: false

triggers:
  - trigger: mqtt
    topic: !input knob_action_topic
    id: knob
  - trigger: state
    entity_id: !input mode_select
    from: event
    to: command
    id: triple
  - trigger: state
    entity_id: !input mode_select
    from: command
    to: event
    id: triple_rev
  - trigger: template
    value_template: >
      {{ expand(integration_entities('music_assistant') | select('search', 'media_player') | list) | selectattr('state', 'eq', 'playing') | map(attribute='entity_id') | sort | join(',') }}
    id: keeper

variables:
  event_map:
    # Command-mode vocabulary.
    brightness_step_up: volume_right
    brightness_step_down: volume_left
    toggle: press
    double: double_press
    hue_move: hold
    color_temperature_step_up: seek_right
    color_temperature_step_down: seek_left
    # Event-mode vocabulary (the triple toggle can land the knob here).
    rotate_right: volume_right
    rotate_left: volume_left
    single: press
    hold: hold
  source: !input speaker_source
  mode_sel: !input mode_select
  picked: !input speaker_pick
  group_in: !input speaker_group
  excl: !input exclude_players
  memory: !input memory_helper
  remember: !input remember_speaker
  latch: !input seek_latch
  # Stamp of the most recent rotation (optional helper): a hold
  # arriving just after turns was a seek that ran long, not a new
  # favourite. Empty keeps the old forward-watch-only behaviour.
  turn_stamp: !input last_turn_helper
  # Numeric form of the stamp, read via the helper's `timestamp`
  # attribute (epoch seconds) rather than string-parsing its state:
  # a time-only helper's "HH:MM:SS" state makes as_timestamp() fail,
  # while the attribute degrades gracefully (unknown/unset -> 0 ->
  # the suppression below simply stays off). Defined after turn_stamp:
  # variables evaluate top-down.
  turn_ts: "{{ state_attr(turn_stamp, 'timestamp') | float(0) if turn_stamp else 0 }}"
  announce_msg: !input announce_message
  announce_voice: !input announce_voice
  announce_speaker: !input announce_speaker
  announce_speed: !input announce_speed
  db_step: !input volume_db_per_detent
  seek_step: !input seek_seconds
  window: !input seek_window
  win_secs: "{{ (window.hours | int(0)) * 3600 + (window.minutes | int(0)) * 60 + (window.seconds | int(0)) }}"
  # Music Assistant's own players only — the room also holds non-MA
  # media players that must never be candidates.
  ma_players: "{{ integration_entities('music_assistant') | select('match', 'media_player\\.') | list }}"
  room_area: "{{ area_id(mode_sel) }}"
  room_cands: "{{ area_entities(room_area) | select('in', ma_players) | list if room_area else [] }}"
  group_cands: "{{ expand(group_in) | map(attribute='entity_id') | list if group_in else [] }}"
  picked_cands: "{{ picked if picked else [] }}"
  raw_cands: "{{ room_cands if source == 'knob_room' else (picked_cands if source == 'pick_players' else group_cands) }}"
  excluded: "{{ excl if excl else [] }}"
  # Ghost-proofing: never target unavailable/unknown players, or the
  # knob silently no-ops on a dead entity while the real speaker idles.
  avail: "{{ expand(raw_cands | reject('in', excluded) | list) | rejectattr('state', 'in', ['unavailable', 'unknown']) | map(attribute='entity_id') | list }}"
  members: "{{ avail }}"
  now_playing: "{{ expand(members) | selectattr('state','eq','playing') | map(attribute='entity_id') | list }}"
  stored: "{{ states(memory) if memory else 'none' }}"
  target: >
    {% if now_playing %}{{ now_playing[0] }}
    {% elif stored in members %}{{ stored }}
    {% elif members %}{{ members[0] }}
    {% else %}none{% endif %}
  # Empty announce speaker falls back to the knob's current speaker,
  # so the announcement follows the music like the favourite does.
  # Defined AFTER target: HA evaluates variables top-down, so a
  # forward reference renders empty and tts.speak rejects it.
  ann_speaker: "{{ announce_speaker if announce_speaker else target }}"
  # Announcement text with the track filled in. Defined after target so
  # the media_title lookup has a speaker to read from.
  ann_text: >-
    {{ announce_msg | replace('{song}', state_attr(target, 'media_title') or 'the track')
       | replace('{artist}', state_attr(target, 'media_artist') or 'unknown artist') }}
  # Own position clock (required input_text helper): the player feed
  # only refreshes position in the first seconds of each track, so the
  # knob keeps its own anchor and extrapolates while playing. Parsed
  # here (top-level variables are visible in every gesture sequence);
  # the seek step decides clock vs feed vs raw. Defined after target:
  # variables evaluate top-down. An empty/missing/garbage helper
  # parses to {} and every clock check below simply stays off.
  clock: !input position_clock
  cur_title: "{{ state_attr(target, 'media_title') or '' }}"
  clock_raw: "{{ states(clock) if clock else '' }}"
  # Template variables always render to strings, so the parsed anchor
  # cannot survive as a mapping — validate once here, then re-parse
  # from clock_raw at each use site. The clk_valid guard skips parsing
  # for empty helpers, and every from_json carries a {} default so a
  # helper value the engine chokes on degrades to feed-only behaviour
  # instead of killing the run.
  clk_valid: "{{ 1 if (clock and (clock_raw | trim)[:1] == '{') else 0 }}"
  clk_t: "{{ (clock_raw | from_json({})).get('t', '') if clk_valid | int == 1 else '' }}"
  clk_p: "{{ (clock_raw | from_json({})).get('p', 0) | float(0) if clk_valid | int == 1 else 0 }}"
  clk_w: "{{ (clock_raw | from_json({})).get('w', 0) | float(0) if clk_valid | int == 1 else 0 }}"
  clk_s: "{{ (clock_raw | from_json({})).get('s', 0) | int(0) if clk_valid | int == 1 else 0 }}"

conditions:
  - alias: "Knob input in a known vocabulary, and at least one candidate speaker"
    condition: template
    value_template: "{{ members | count > 0 and (trigger.id in ['triple', 'triple_rev', 'keeper'] or trigger.payload in event_map) }}"

actions:
  - choose:
      - alias: "External playback: remember the speaker"
        conditions: "{{ trigger.id == 'keeper' }}"
        sequence:
          - alias: "Only when the memory helper is set and something knob-eligible is playing"
            condition: template
            value_template: "{{ memory and now_playing }}"
          - alias: "Remember the first playing speaker"
            action: input_text.set_value
            target:
              entity_id: "{{ memory }}"
            data:
              value: "{{ now_playing[0] }}"
      - alias: "Triple-press: previous track (fires on either mode flip)"
        conditions: "{{ trigger.id in ['triple', 'triple_rev'] }}"
        sequence:
          # MA treats a lone previous as restart-current once past its
          # restart threshold, so consult the position clock (clock,
          # else fresh feed, else raw sample — same order as seek):
          # near the start a single previous steps straight back with
          # no restart-blip; further in, fire twice (first restarts,
          # second steps back). Non-playing or unknown position takes
          # the safe double-fire.
          - variables:
              t_pos: "{{ state_attr(target, 'media_position') | float(0) }}"
              t_upd: "{{ state_attr(target, 'media_position_updated_at') }}"
              t_now: "{{ as_timestamp(now()) }}"
              t_feed_ts: "{{ as_timestamp(t_upd) if (t_upd is string and '-' in t_upd) else 0 }}"
              t_feed_ok: "{{ 1 if (is_state(target, 'playing') and t_feed_ts | float > 0 and (t_now | float - t_feed_ts | float) < 60) else 0 }}"
              t_clock_ok: "{{ 1 if (clk_t == cur_title and cur_title != '' and clk_s | int == 1 and is_state(target, 'playing') and clk_w | float > 0) else 0 }}"
              t_base: "{% if t_clock_ok | int == 1 %}{{ [clk_p | float + (t_now | float - clk_w | float), 0.0] | max }}{% elif t_feed_ok | int == 1 %}{{ t_pos | float + (t_now | float - t_feed_ts | float) }}{% else %}{{ t_pos }}{% endif %}"
              t_near_start: "{{ 1 if (is_state(target, 'playing') and t_base | float(0) <= 5) else 0 }}"
          - alias: "Previous (steps straight back near the track start)"
            action: media_player.media_previous_track
            target:
              entity_id: "{{ target }}"
          - alias: "Previous again when further in (first only restarted)"
            choose:
              - conditions: "{{ t_near_start | int == 0 }}"
                sequence:
                  - delay: "00:00:02"
                  - action: media_player.media_previous_track
                    target:
                      entity_id: "{{ target }}"
          # Same as double-press: the track changes, blank anchor.
          - alias: Invalidate the position clock (track changing)
            choose:
              - conditions: "{{ clock is defined and clock and clock != '' }}"
                sequence:
                  - action: input_text.set_value
                    target:
                      entity_id: "{{ clock }}"
                    data:
                      value: "{{ {'t': '', 'p': 0, 'w': as_timestamp(now()), 's': 0} | to_json }}"
      - alias: "Knob input"
        conditions: "{{ trigger.id == 'knob' }}"
        sequence:
          - variables:
              gesture: "{{ event_map[trigger.payload] }}"
              fwd: "{{ gesture in ['volume_right', 'seek_right'] }}"
              # Command-mode press-and-turn (color_temperature) seeks
              # unconditionally — the firmware distinguishes it. Plain
              # rotates seek only while a hold is in progress (latch on
              # and fresh); otherwise they change volume.
              seeking: >-
                {{ gesture in ['seek_right', 'seek_left'] or
                   (gesture in ['volume_right', 'volume_left'] and
                    is_state(latch, 'on') and
                    (now() - states[latch].last_changed).total_seconds() < (win_secs | float)) }}
          - choose:
              - alias: "Turn while held: seek"
                conditions: "{{ seeking }}"
                sequence:
                  # Stamp every turn: a hold arriving just after turns
                  # was a seek that ran long — the hold step checks this
                  # stamp and skips the favourite.
                  - alias: Stamp this turn for the hold step
                    choose:
                      - conditions: "{{ (turn_stamp | default('')) != '' }}"
                        sequence:
                          - action: input_datetime.set_datetime
                            target:
                              entity_id: "{{ turn_stamp }}"
                            data:
                              timestamp: "{{ now().timestamp() }}"
                  - variables:
                      pos: "{{ state_attr(target, 'media_position') | float(0) }}"
                      upd: "{{ state_attr(target, 'media_position_updated_at') }}"
                      dur: "{{ state_attr(target, 'media_duration') | float(0) }}"
                      now_ts: "{{ as_timestamp(now()) }}"
                      feed_ts: "{{ as_timestamp(upd) if (upd is string and '-' in upd) else 0 }}"
                      # Fresh feed (< 60 s): project forward while playing.
                      # Rendered 1/0, never True/False: a bare boolean
                      # renders "False", which is a non-empty (thus truthy)
                      # string in the {% if %} below.
                      feed_ok: "{{ 1 if (is_state(target, 'playing') and feed_ts | float > 0 and (now_ts | float - feed_ts | float) < 60) else 0 }}"
                      # Own clock: usable only while it names the track still
                      # playing, was left playing, and carries a real anchor.
                      # A paused clock stays frozen, a track change
                      # invalidates it (the press / double / triple /
                      # announce steps maintain it — see below).
                      clock_ok: "{{ 1 if (clk_t == cur_title and cur_title != '' and clk_s | int == 1 and is_state(target, 'playing') and clk_w | float > 0) else 0 }}"
                      # Clock first (exact while it is ours), fresh feed
                      # second, raw sample last. seek_to clamps to [0, dur]
                      # below, so runaway extrapolation can never catapult
                      # past the track end the way a stale feed sample did.
                      base_pos: "{% if clock_ok | int == 1 %}{{ [clk_p | float + (now_ts | float - clk_w | float), 0.0] | max }}{% elif feed_ok | int == 1 %}{{ pos | float + (now_ts | float - feed_ts | float) }}{% else %}{{ pos }}{% endif %}"
                      stepped: "{{ (base_pos | float) + (seek_step | float if fwd else -(seek_step | float)) }}"
                      seek_to: "{{ ([([stepped | float, 0.0] | max), dur | float] | min) if (dur | float > 0) else (stepped | float) }}"
                  # No duration (idle/stale player) means nowhere to seek: stop.
                  - alias: "Stop when the player has no duration"
                    condition: template
                    value_template: "{{ dur | float(0) > 0 }}"
                  - alias: Seek the track
                    action: media_player.media_seek
                    target:
                      entity_id: "{{ target }}"
                    data:
                      seek_position: "{{ seek_to }}"
                  # Leave our own anchor where we landed: the next detent
                  # (or the next press-turn minutes from now) extrapolates
                  # from here instead of from the player's stale feed.
                  - alias: Anchor the position clock on this seek
                    choose:
                      - conditions: "{{ clock is defined and clock and clock != '' }}"
                        sequence:
                          - action: input_text.set_value
                            target:
                              entity_id: "{{ clock }}"
                            data:
                              value: "{{ {'t': cur_title, 'p': seek_to | float, 'w': now_ts | float, 's': 1 if is_state(target, 'playing') else 0} | to_json }}"
              - alias: "Plain turn: volume"
                conditions: "{{ gesture == 'volume_right' or gesture == 'volume_left' }}"
                sequence:
                  # Stamp every turn, seek or volume alike: a hold
                  # arriving just after any turn was part of that
                  # gesture, not a new favourite.
                  - alias: Stamp this turn for the hold step
                    choose:
                      - conditions: "{{ (turn_stamp | default('')) != '' }}"
                        sequence:
                          - action: input_datetime.set_datetime
                            target:
                              entity_id: "{{ turn_stamp }}"
                            data:
                              timestamp: "{{ now().timestamp() }}"
                  - variables:
                      # float(0.02): unreadable/off players start from ~2% so the
                      # first upward detent from silence always kicks audibly;
                      # multiplying up from true 0 would stay at 0 forever, so
                      # the kick also applies when the level reads exactly 0.
                      # Quantization floor: MA holds whole percent, so a bare
                      # x1.122 step below ~9% rounds back to the same level
                      # (2% -> 2.24% -> reads 2% -> stuck forever). Force at
                      # least a one-point move each detent in both directions.
                      cur: "{{ state_attr(target, 'volume_level') | float(0.02) }}"
                      factor: "{{ 10 ** (db_step | float / 20) }}"
                      base: "{{ cur | float if (cur | float) > 0 else 0.02 }}"
                      raw: "{{ ([(base | float) * (factor | float), (base | float) + 0.01] | max) if fwd else ([(base | float) / (factor | float), (base | float) - 0.01] | min) }}"
                      # Taper down asymptotes to zero without reaching it: snap
                      # anything below -46 dB to true 0. Clamp to [0, 1].
                      level: "{{ 0.0 if (not fwd and (raw | float) < 0.005) else ([[(raw | float), 0.0] | max, 1.0] | min | round(3)) }}"
                  - alias: Set the volume
                    action: media_player.volume_set
                    target:
                      entity_id: "{{ target }}"
                    data:
                      volume_level: "{{ level }}"
              - alias: "Press: play/pause"
                conditions: "{{ gesture == 'press' }}"
                sequence:
                  # No toggle: MA players don't all implement it, so
                  # branch on state with the universal play/pause pair.
                  - choose:
                      - alias: "Pause the playing speaker"
                        conditions: "{{ is_state(target, 'playing') }}"
                        sequence:
                          # Freeze the clock where the music stops: prefer
                          # our own anchor (exact while it is ours), else a
                          # fresh feed sample projected, else the raw sample.
                          - alias: Freeze the position clock on pause
                            choose:
                              - conditions: "{{ clock is defined and clock and clock != '' }}"
                                sequence:
                                  - variables:
                                      p_pos: "{{ state_attr(target, 'media_position') | float(0) }}"
                                      p_upd: "{{ state_attr(target, 'media_position_updated_at') }}"
                                      p_est: "{% if clk_t == cur_title and cur_title != '' and clk_s | int == 1 and clk_w | float > 0 %}{{ [clk_p | float + (as_timestamp(now()) - clk_w | float), 0.0] | max }}{% elif p_upd is string and '-' in p_upd and (as_timestamp(now()) - as_timestamp(p_upd)) < 60 %}{{ p_pos | float + (as_timestamp(now()) - as_timestamp(p_upd)) }}{% else %}{{ p_pos }}{% endif %}"
                                  - action: input_text.set_value
                                    target:
                                      entity_id: "{{ clock }}"
                                    data:
                                      value: "{{ {'t': cur_title, 'p': p_est | float, 'w': as_timestamp(now()), 's': 0} | to_json }}"
                          - action: media_player.media_pause
                            target:
                              entity_id: "{{ target }}"
                    default:
                      - alias: Play the idle speaker
                        sequence:
                          # Resume keeps the position: keep the stored anchor
                          # when it names this track, else the raw sample —
                          # and mark playing with a fresh wall time.
                          - alias: Re-anchor the position clock on play
                            choose:
                              - conditions: "{{ clock is defined and clock and clock != '' }}"
                                sequence:
                                  - variables:
                                      r_p: "{% if clk_t == cur_title and cur_title != '' %}{{ clk_p }}{% else %}{{ state_attr(target, 'media_position') | float(0) }}{% endif %}"
                                  - action: input_text.set_value
                                    target:
                                      entity_id: "{{ clock }}"
                                    data:
                                      value: "{{ {'t': cur_title, 'p': r_p | float, 'w': as_timestamp(now()), 's': 1} | to_json }}"
                          - action: media_player.media_play
                            target:
                              entity_id: "{{ target }}"
              - alias: "Double-press: next track"
                conditions: "{{ gesture == 'double_press' }}"
                sequence:
                  - alias: Skip to next track
                    action: media_player.media_next_track
                    target:
                      entity_id: "{{ target }}"
                  # A new track is coming: blank the anchor so the next
                  # seek re-anchors instead of extrapolating into it.
                  - alias: Invalidate the position clock (track changing)
                    choose:
                      - conditions: "{{ clock is defined and clock and clock != '' }}"
                        sequence:
                          - action: input_text.set_value
                            target:
                              entity_id: "{{ clock }}"
                            data:
                              value: "{{ {'t': '', 'p': 0, 'w': as_timestamp(now()), 's': 0} | to_json }}"
              - alias: "Hold: favourite (+ optional announce)"
                conditions: "{{ gesture == 'hold' }}"
                sequence:
                  # Echo guard: a hold arriving while a previous hold's
                  # window is still open is the firmware's double echo
                  # (or a re-press mid-gesture), not a new press — the
                  # first waiter already owns this gesture. A shared
                  # last-triggered timestamp misfired whenever ANY trigger
                  # (e.g. a rotation) had fired recently, swallowing real
                  # favourites — hence this latch-based guard.
                  - alias: Skip firmware double-echoes and mid-gesture re-presses
                    condition: template
                    value_template: "{{ not is_state(latch, 'on') or (now() - states[latch].last_changed).total_seconds() > (win_secs | float) }}"
                  - alias: Arm the seek latch
                    action: input_boolean.turn_on
                    target:
                      entity_id: "{{ latch }}"
                  # Look back as well as forward: press-and-rotate sends
                  # its turns BEFORE the knob's ~3 s hold threshold fires,
                  # so a forward-only watch always misses them and every
                  # long seek ends in a favourite. If a turn landed within
                  # the window just before this hold, the music already
                  # seeked (or the volume already moved) — disarm and stop:
                  # no wait, no favourite.
                  - alias: Skip when turns just preceded (seek, not favourite)
                    choose:
                      - conditions: "{{ turn_ts > 0 and (as_timestamp(now()) - turn_ts) < (win_secs | float) }}"
                        sequence:
                          - alias: Disarm the seek latch
                            action: input_boolean.turn_off
                            target:
                              entity_id: "{{ latch }}"
                          - alias: Stop, the turns already landed
                            condition: template
                            value_template: "{{ false }}"
                  # A hold arriving just after a favourite landed is the
                  # same finger still down (hue_move repeats while held),
                  # not a new press: the first waiter already favourited
                  # and announced. Without this, every window-length of
                  # continued holding favourites and announces again, each
                  # announcement later than the last.
                  - alias: Skip when a favourite just landed (continued hold, not a new press)
                    choose:
                      - conditions: >-
                          {% set fav = device_entities(device_id(target)) | select('search', 'favou?r') | list | first %}
                          {{ fav and (as_timestamp(now()) - as_timestamp(states[fav].last_changed, 0)) < (win_secs | float) }}
                        sequence:
                          - alias: Disarm the seek latch
                            action: input_boolean.turn_off
                            target:
                              entity_id: "{{ latch }}"
                          - alias: Stop, the favourite already landed
                            condition: template
                            value_template: "{{ false }}"
                  # Own the whole press: if a turn follows within the
                  # window this was a seek (the rotation runs already
                  # seeked via the latch) — suppress the favourite.
                  - alias: Wait to see if a turn follows (seek) or not (favourite)
                    wait_for_trigger:
                      - trigger: mqtt
                        topic: !input knob_action_topic
                        payload: rotate_right
                      - trigger: mqtt
                        topic: !input knob_action_topic
                        payload: rotate_left
                      - trigger: mqtt
                        topic: !input knob_action_topic
                        payload: color_temperature_step_up
                      - trigger: mqtt
                        topic: !input knob_action_topic
                        payload: color_temperature_step_down
                    timeout: !input seek_window
                    continue_on_timeout: true
                  - alias: Disarm the seek latch
                    action: input_boolean.turn_off
                    target:
                      entity_id: "{{ latch }}"
                  - alias: Favourite only when no turn followed
                    condition: template
                    value_template: "{{ not wait.completed }}"
                  # Favourite via the MA integration's per-player button,
                  # resolved generically through the target's device — no
                  # hardcoded button entity id to maintain. The search
                  # covers both US `favorite` and UK `favourite`
                  # spellings (`search` takes a regex, `?` makes the
                  # `u` optional).
                  - alias: Press the player's favourite button
                    action: button.press
                    target:
                      entity_id: "{{ device_entities(device_id(target)) | select('search', 'favou?r') | list | first }}"
                  # Optional announce: the message ships prefilled and
                  # generic ({song}/{artist} become track/artist); it talks
                  # once a voice is picked, on the picked speaker or the
                  # knob's current one. Goes through MA's own announcement
                  # service with the pre-announce chime explicitly OFF —
                  # tts.speak routes through the same playback but always
                  # plays MA's chime first.
                  - alias: Announce the favourite (optional)
                    choose:
                      - conditions: "{{ announce_msg and announce_voice and target != 'none' }}"
                        sequence:
                          # Never let a voice problem abort the gesture —
                          # the favourite has already landed by now.
                          # Custom speed still uses the HA voice path (only
                          # tts.speak passes length_scale to Piper/Wyoming,
                          # and only for Piper/Wyoming voices — other
                          # engines such as Cloud reject length_scale, so
                          # they use the chime-free MA call at natural pace).
                          - alias: Speak the favourite confirmation
                            choose:
                              - alias: Custom speed on Piper/Wyoming (HA voice path)
                                conditions: "{{ (announce_speed | float(1)) != 1 and ('piper' in (announce_voice or '') or 'wyoming' in (announce_voice or '')) }}"
                                sequence:
                                  - action: tts.speak
                                    continue_on_error: true
                                    target:
                                      entity_id: "{{ announce_voice }}"
                                    data:
                                      media_player_entity_id: "{{ ann_speaker }}"
                                      options:
                                        length_scale: "{{ (1 / (announce_speed | float(1))) | round(3) }}"
                                      message: "{{ ann_text }}"
                            default:
                              - alias: Chime-free MA announcement
                                action: music_assistant.play_announcement
                                continue_on_error: true
                                target:
                                  entity_id: "{{ ann_speaker }}"
                                data:
                                  tts_entity_id: "{{ announce_voice }}"
                                  message: "{{ ann_text }}"
                                  use_pre_announce: false
                          # Announcements restart the audio flow, so the old
                          # anchor is suspect — blank it and let the next
                          # seek re-anchor from the feed. Silent favourites
                          # never interrupt audio, so the clock stands.
                          - alias: Invalidate the position clock (announcement moved playback)
                            choose:
                              - conditions: "{{ clock is defined and clock and clock != '' }}"
                                sequence:
                                  - action: input_text.set_value
                                    target:
                                      entity_id: "{{ clock }}"
                                    data:
                                      value: "{{ {'t': '', 'p': 0, 'w': as_timestamp(now()), 's': 0} | to_json }}"
  # Diary write-back (optional, off by default): after any successful
  # gesture, record the speaker just used so the knob finds it next
  # time everything is idle. Skipped silently without a memory helper
  # or when nothing resolved.
  - alias: "Remember the speaker for next time (optional, off by default)"
    condition: template
    value_template: "{{ remember and memory and target != 'none' }}"
  - alias: Write the speaker to memory
    action: input_text.set_value
    target:
      entity_id: "{{ memory }}"
    data:
      value: "{{ target }}"

# Parallel: rotation runs stay instant while a hold run waits out the
# seek window; the latch (not run ordering) decides seek vs volume.
# Silent when overlapping runs exceed the cap (fast spins).
mode: parallel
max: 10
max_exceeded: silent
