blueprint:
  name: Zigbee smart knob to Music Assistant (native, no relay)
  description: >
    Wire a Zigbee2MQTT smart knob (HOBEIAN / Moes ZG-101ZD and similar
    Tuya knobs) straight to Music Assistant with no extra software: no
    relay, no Python, no add-on, nothing to host. Rotate for volume
    with a ~1 dB logarithmic taper, press for play/pause, double-press
    for next track, triple-press for previous track, bare hold to
    favourite the current song, turn-while-held to seek with duration
    clamping.

    **Setup (2 minutes):** 1) Assign the knob to its room in HA
    (Settings → Devices) — room mode reads it from the mode select
    below. 2) Create one `input_boolean` helper as the seek latch
    (e.g. `input_boolean.knob_seek`, one per knob). 3) Pick the speaker
    source: the knob's room (default), hand-picked players, or a group.
    4) Optionally list players the knob must never touch (TVs,
    displays) — applies in every mode. 5) Optionally point the memory
    at an `input_text` (memory keeper in
    `examples/ma-active-player-memory.yaml`) or leave it empty to skip.

    Every deliberate triple-press TOGGLES the knob's operation_mode
    (event<->command) instead of emitting an action — verified live
    Nov 2026 — so the blueprint watches BOTH flip directions and never
    writes the mode back (remote mode-set does not land on this
    firmware). The drift means the knob speaks two vocabularies
    (event: rotate_right/rotate_left/single/double/hold; command:
    brightness_step_up/down/toggle/double/hue_move); both are mapped,
    so every gesture works in either mode.

    Event-mode press-and-turn is firmware-indistinguishable from
    volume+hold, so seek vs favourite is disambiguated by gesture
    shape: rotations while the seek latch is on seek instead of
    changing volume, and the favourite waits out the seek window to
    make sure you are not turning. Technique: press and turn (pause a
    beat first in event mode; in command mode no pause is needed).
    Residuals: the favourite lands ~2 s late; spinning the instant you
    press nudges volume for the first detent(s) before the hold
    registers; within the window after a favourite-hold, turns seek
    instead of voluming. A fast triple parses as `double` (next track)
    and may ALSO flip the mode (previous) — verify on install.

    Tested on HA 2026.10.4. Minimum version 2024.6.0 (input sections).
  domain: automation
  source_url: https://github.com/kiwipaulrob/ma-fav-button/blob/main/blueprints/automation/kiwipaulrob/zg101zd_knob_ma_native.yaml
  author: kiwipaulrob
  homeassistant:
    min_version: 2024.6.0
  input:
    knob_action_topic:
      name: Knob action MQTT topic
      description: >
        The knob's MQTT action topic: zigbee2mqtt/<friendly-name>/action
        using the name shown on the knob's Zigbee2MQTT device page
        (e.g. a knob called "knob" gives zigbee2mqtt/knob/action —
        spaces in the name appear as underscores). To confirm: open the
        knob in the Zigbee2MQTT UI and press it — the Action field under
        Exposes updates with each press. If you changed Z2M's base topic
        (Settings → MQTT), use that instead of zigbee2mqtt. Payloads are
        plain-text action strings in either operation mode (see above).
      default: zigbee2mqtt/knob/action
      selector:
        text:
    mode_select:
      name: Knob operation-mode select
      description: >
        The Z2M operation_mode select entity for this knob (e.g.
        select.knob_2_operation_mode). Triple-press emits no action —
        it only flips this select event<->command — so the blueprint
        fires on BOTH flip directions. The blueprint never writes it.
        Room mode reads the knob's room from this entity, so the knob
        must be assigned to its room (Settings → Devices). Find it at
        Settings → Devices → your knob → entities (the one ending in
        operation_mode): knobs like this one expose an
        operation_mode select, and triple-clicking the knob is the only
        thing that flips it.
      selector:
        entity:
          domain: select
    speaker_source:
      name: Which speakers can the knob control?
      description: >
        Knob's room follows the room the knob itself is assigned to
        (no extra picking). Choose players/groups to curate manually.
      default: knob_room
      selector:
        select:
          options:
            - label: Knob's room (recommended)
              value: knob_room
            - label: Choose players
              value: pick_players
            - label: Choose a group
              value: pick_group
    speaker_pick:
      name: Players
      description: >
        The MA players the knob may control. Resolution order is
        playing → remembered → this list in order, so list your
        most-used speaker first. Leave TVs and displays out, or add
        them to Never-pick below. Only used when "Which speakers can
        the knob control?" is set to Choose players.
      default: []
      selector:
        entity:
          multiple: true
          reorder: true
          filter:
            - integration: music_assistant
              domain: media_player
    speaker_group:
      name: Speaker group
      description: >
        Group helper with your MA speaker media_players. Pairs with
        the memory keeper (examples/ma-active-player-memory.yaml).
        Only used when "Which speakers can the knob control?" is set
        to Choose a group.
      default:
      selector:
        entity:
          domain: group
    exclude_players:
      name: Never-pick
      description: >
        Players the knob must never control — TVs, dashboard
        displays, anything shared. Applies in every mode above.
        (Music Assistant exposes some of these as players, so
        auto-discovery alone cannot exclude them.)
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: media_player
    memory_helper:
      name: Active-player memory (optional)
      description: >
        input_text helper holding the last-used speaker. The knob
        writes it itself when "Knob remembers last speaker" below is
        on; the memory-keeper automation
        (examples/ma-active-player-memory.yaml) additionally catches
        playback started outside the knob (phone app, voice). Leave
        empty to skip — the knob falls back to the first candidate when
        nothing is playing.
      default:
      selector:
        entity:
          domain: input_text
    remember_speaker:
      name: Knob remembers last speaker (optional, off by default)
      description: >
        When on, every gesture writes the speaker just used into the
        memory helper above, so the knob finds it next time everything
        is idle — the knob writes its own diary, one tiny write per
        gesture. Needs the memory helper set; without it this does
        nothing. Leave off with a single speaker (the fallback already
        lands correctly) or while testing. The separate memory-keeper
        automation stays useful for playback started outside the knob.
      default: false
      selector:
        boolean:
    seek_latch:
      name: Seek latch helper
      description: >
        input_boolean helper that arms seek mode while the knob is
        held — one per knob. Create it first: Settings → Devices &
        services → Helpers → + Create helper → Toggle, named e.g.
        "Knob seek" (a second knob gets its own, e.g. "Knob 2 seek").
        Leave it off; the blueprint switches it on and off by itself.
        Rotations while it is on seek instead of changing volume.
        Reads are time-bounded, so a latch stuck on by a restart
        self-heals after the seek window.
      selector:
        entity:
          domain: input_boolean
    announce_message:
      name: Announce message (optional)
      description: >
        Said aloud after a hold favourites the song. {song} becomes
        the track name and {artist} the artist — e.g. the default reads
        "Added Dreams by Fleetwood Mac to favourites" (missing names
        degrade gracefully). Clear it for silence; the voice below and
        a speaker decide whether it talks at all.
      default: "Added {song} by {artist} to favourites"
      selector:
        text:
    announce_voice:
      name: Announce voice (optional)
      description: >
        Which voice says it (e.g. tts.piper). Empty = silent, even
        with a message above.
      default:
      selector:
        entity:
          domain: tts
    announce_speaker:
      name: Announce speaker (optional)
      description: >
        Which speaker says it — empty means the knob's current speaker
        (whatever the speaker choice above resolved to for this press).
        Must be a Music Assistant player: the confirmation goes through
        MA's announcement service with the pre-announce chime off, which
        only targets MA players. Never a TV.
      default:
      selector:
        entity:
          domain: media_player
    announce_speed:
      name: Announce speed (optional)
      description: >
        How fast the favourite confirmation is spoken, as a multiple
        of the voice's natural pace (0.8 = slower, 1.2 = faster).
        Passed to the voice as Piper/Wyoming `length_scale` (its
        inverse: higher length means slower speech), so it only affects
        Piper/Wyoming voices — other engines ignore it. 1.0 = natural
        pace. Note: speeds other than 1.0 only apply to Piper/Wyoming
        voices (HA voice path); other engines ignore the speed and stay
        chime-free.
      default: 1
      selector:
        number:
          min: 0.5
          max: 1.5
          step: 0.1
    tuning:
      name: Tuning
      icon: mdi:tune
      description: Feel and timing. Defaults suit most knobs.
      collapsed: true
      input:
        volume_db_per_detent:
          name: Volume step
          description: >
            dB per rotation detent. 1 dB multiplies/divides the level
            by ~1.122 each detent (logarithmic, matches human hearing).
          default: 1
          selector:
            number:
              min: 0.5
              max: 3
              step: 0.5
              unit_of_measurement: dB
        seek_seconds:
          name: Seek step
          description: Seconds per detent when turning while held.
          default: 10
          selector:
            number:
              min: 5
              max: 60
              step: 5
              unit_of_measurement: s
        seek_window:
          name: Hold-to-seek window
          description: >
            How long after a hold turns seek (and the favourite waits
            to make sure you are not turning). Longer is more forgiving
            of pause-then-turn; the favourite lands this much later.
          default:
            hours: 0
            minutes: 0
            seconds: 2
          selector:
            duration:
              enable_day: false
        last_turn_helper:
          name: Recent-turn stamp helper
          description: >
            An input_datetime the knob stamps on every rotation. A hold
            arriving just after turns was a seek that ran long, not a
            new favourite — without this, every press-and-rotate that
            crosses the knob's ~3 s hold threshold favourites. Create
            an input_datetime helper and pick it here; empty keeps the
            old forward-watch-only behaviour. The helper MUST store date
            AND time — tick both on when creating it (HA offers date-only,
            which silently disables this fix: a date-only stamp always
            reads as midnight, so the hold step never sees a recent turn).
          default:
          selector:
            entity:
              domain: input_datetime

triggers:
  - trigger: mqtt
    topic: !input knob_action_topic
    id: knob
  - trigger: state
    entity_id: !input mode_select
    from: event
    to: command
    id: triple
  - trigger: state
    entity_id: !input mode_select
    from: command
    to: event
    id: triple_rev

variables:
  event_map:
    # Command-mode vocabulary.
    brightness_step_up: volume_right
    brightness_step_down: volume_left
    toggle: press
    double: double_press
    hue_move: hold
    color_temperature_step_up: seek_right
    color_temperature_step_down: seek_left
    # Event-mode vocabulary (the triple toggle drifts the knob here).
    rotate_right: volume_right
    rotate_left: volume_left
    single: press
    hold: hold
  source: !input speaker_source
  mode_sel: !input mode_select
  picked: !input speaker_pick
  group_in: !input speaker_group
  excl: !input exclude_players
  memory: !input memory_helper
  remember: !input remember_speaker
  latch: !input seek_latch
  # Stamp of the most recent rotation (optional helper): a hold
  # arriving just after turns was a seek that ran long, not a new
  # favourite. Empty keeps the old forward-watch-only behaviour.
  turn_stamp: !input last_turn_helper
  # Numeric form of the stamp, read via the helper's `timestamp`
  # attribute (epoch seconds) rather than string-parsing its state:
  # a time-only helper's "HH:MM:SS" state makes as_timestamp() fail,
  # while the attribute degrades gracefully (unknown/unset -> 0 ->
  # the suppression below simply stays off). Defined after turn_stamp:
  # variables evaluate top-down.
  turn_ts: "{{ state_attr(turn_stamp, 'timestamp') | float(0) if turn_stamp else 0 }}"
  announce_msg: !input announce_message
  announce_voice: !input announce_voice
  announce_speaker: !input announce_speaker
  announce_speed: !input announce_speed
  db_step: !input volume_db_per_detent
  seek_step: !input seek_seconds
  window: !input seek_window
  win_secs: "{{ (window.hours | int(0)) * 3600 + (window.minutes | int(0)) * 60 + (window.seconds | int(0)) }}"
  # Music Assistant's own players only — the room also holds non-MA
  # media players that must never be candidates.
  ma_players: "{{ integration_entities('music_assistant') | select('match', 'media_player\\.') | list }}"
  room_area: "{{ area_id(mode_sel) }}"
  room_cands: "{{ area_entities(room_area) | select('in', ma_players) | list if room_area else [] }}"
  group_cands: "{{ expand(group_in) | map(attribute='entity_id') | list if group_in else [] }}"
  picked_cands: "{{ picked if picked else [] }}"
  raw_cands: "{{ room_cands if source == 'knob_room' else (picked_cands if source == 'pick_players' else group_cands) }}"
  excluded: "{{ excl if excl else [] }}"
  # Ghost-proofing: never target unavailable/unknown players, or the
  # knob silently no-ops on a dead entity while the real speaker idles.
  avail: "{{ expand(raw_cands | reject('in', excluded) | list) | rejectattr('state', 'in', ['unavailable', 'unknown']) | map(attribute='entity_id') | list }}"
  members: "{{ avail }}"
  now_playing: "{{ expand(members) | selectattr('state','eq','playing') | map(attribute='entity_id') | list }}"
  stored: "{{ states(memory) if memory else 'none' }}"
  target: >
    {% if now_playing %}{{ now_playing[0] }}
    {% elif stored in members %}{{ stored }}
    {% elif members %}{{ members[0] }}
    {% else %}none{% endif %}
  # Empty announce speaker falls back to the knob's current speaker,
  # so the announcement follows the music like the favourite does.
  # Defined AFTER target: HA evaluates variables top-down, so a
  # forward reference renders empty and tts.speak rejects it.
  ann_speaker: "{{ announce_speaker if announce_speaker else target }}"
  # Announcement text with the track filled in. Defined after target so
  # the media_title lookup has a speaker to read from.
  ann_text: >-
    {{ announce_msg | replace('{song}', state_attr(target, 'media_title') or 'the track')
       | replace('{artist}', state_attr(target, 'media_artist') or 'unknown artist') }}

conditions:
  - alias: "Knob input in a known vocabulary, and at least one candidate speaker"
    condition: template
    value_template: "{{ members | count > 0 and (trigger.id in ['triple', 'triple_rev'] or trigger.payload in event_map) }}"

actions:
  - choose:
      - alias: "Triple-press: previous track (fires on either mode flip)"
        conditions: "{{ trigger.id in ['triple', 'triple_rev'] }}"
        sequence:
          # MA treats a lone previous as restart-current once past its
          # restart threshold, so fire twice: the first restarts, the
          # second steps back. Mirrors the relay's dim_prev behaviour.
          - alias: "Previous (restarts the current track)"
            action: media_player.media_previous_track
            target:
              entity_id: "{{ target }}"
          - delay: "00:00:02"
          - alias: "Previous again (steps back)"
            action: media_player.media_previous_track
            target:
              entity_id: "{{ target }}"
      - alias: "Knob input"
        conditions: "{{ trigger.id == 'knob' }}"
        sequence:
          - variables:
              gesture: "{{ event_map[trigger.payload] }}"
              fwd: "{{ gesture in ['volume_right', 'seek_right'] }}"
              # Command-mode press-and-turn (color_temperature) seeks
              # unconditionally — the firmware distinguishes it. Plain
              # rotates seek only while a hold is in progress (latch on
              # and fresh); otherwise they change volume.
              seeking: >-
                {{ gesture in ['seek_right', 'seek_left'] or
                   (gesture in ['volume_right', 'volume_left'] and
                    is_state(latch, 'on') and
                    (now() - states[latch].last_changed).total_seconds() < (win_secs | float)) }}
          - choose:
              - alias: "Turn while held: seek"
                conditions: "{{ seeking }}"
                sequence:
                  # Stamp every turn: a hold arriving just after turns
                  # was a seek that ran long — the hold step checks this
                  # stamp and skips the favourite.
                  - alias: Stamp this turn for the hold step
                    choose:
                      - conditions: "{{ turn_stamp }}"
                        sequence:
                          - action: input_datetime.set_datetime
                            target:
                              entity_id: "{{ turn_stamp }}"
                            data:
                              timestamp: "{{ now().timestamp() }}"
                  - variables:
                      pos: "{{ state_attr(target, 'media_position') | float(0) }}"
                      upd: "{{ state_attr(target, 'media_position_updated_at') }}"
                      dur: "{{ state_attr(target, 'media_duration') | float(0) }}"
                      # media_position is sampled at updated_at: project forward
                      # while playing so seeks land where the music actually is.
                      live_pos: "{% if is_state(target, 'playing') and upd %}{{ pos + (as_timestamp(now()) - as_timestamp(upd)) }}{% else %}{{ pos }}{% endif %}"
                      stepped: "{{ (live_pos | float) + (seek_step | float if fwd else -(seek_step | float)) }}"
                      seek_to: "{{ ([([stepped | float, 0.0] | max), dur | float] | min) if (dur | float > 0) else (stepped | float) }}"
                  # No duration (idle/stale player) means nowhere to seek: stop.
                  - alias: "Stop when the player has no duration"
                    condition: template
                    value_template: "{{ dur | float(0) > 0 }}"
                  - alias: Seek the track
                    action: media_player.media_seek
                    target:
                      entity_id: "{{ target }}"
                    data:
                      seek_position: "{{ seek_to }}"
              - alias: "Plain turn: volume"
                conditions: "{{ gesture == 'volume_right' or gesture == 'volume_left' }}"
                sequence:
                  # Stamp every turn, seek or volume alike: a hold
                  # arriving just after any turn was part of that
                  # gesture, not a new favourite.
                  - alias: Stamp this turn for the hold step
                    choose:
                      - conditions: "{{ turn_stamp }}"
                        sequence:
                          - action: input_datetime.set_datetime
                            target:
                              entity_id: "{{ turn_stamp }}"
                            data:
                              timestamp: "{{ now().timestamp() }}"
                  - variables:
                      # float(0.02): unreadable/off players start from ~2% so the
                      # first upward detent from silence always kicks audibly;
                      # multiplying up from true 0 would stay at 0 forever, so
                      # the kick also applies when the level reads exactly 0.
                      # Quantization floor: MA holds whole percent, so a bare
                      # x1.122 step below ~9% rounds back to the same level
                      # (2% -> 2.24% -> reads 2% -> stuck forever). Force at
                      # least a one-point move each detent in both directions.
                      cur: "{{ state_attr(target, 'volume_level') | float(0.02) }}"
                      factor: "{{ 10 ** (db_step | float / 20) }}"
                      base: "{{ cur | float if (cur | float) > 0 else 0.02 }}"
                      raw: "{{ ([(base | float) * (factor | float), (base | float) + 0.01] | max) if fwd else ([(base | float) / (factor | float), (base | float) - 0.01] | min) }}"
                      # Taper down asymptotes to zero without reaching it: snap
                      # anything below -46 dB to true 0. Clamp to [0, 1].
                      level: "{{ 0.0 if (not fwd and (raw | float) < 0.005) else ([[(raw | float), 0.0] | max, 1.0] | min | round(3)) }}"
                  - alias: Set the volume
                    action: media_player.volume_set
                    target:
                      entity_id: "{{ target }}"
                    data:
                      volume_level: "{{ level }}"
              - alias: "Press: play/pause"
                conditions: "{{ gesture == 'press' }}"
                sequence:
                  # No toggle: MA players don't all implement it, so
                  # branch on state with the universal play/pause pair.
                  - choose:
                      - alias: "Pause the playing speaker"
                        conditions: "{{ is_state(target, 'playing') }}"
                        sequence:
                          - action: media_player.media_pause
                            target:
                              entity_id: "{{ target }}"
                    default:
                      - alias: "Play the idle speaker"
                        action: media_player.media_play
                        target:
                          entity_id: "{{ target }}"
              - alias: "Double-press: next track"
                conditions: "{{ gesture == 'double_press' }}"
                sequence:
                  - alias: Skip to next track
                    action: media_player.media_next_track
                    target:
                      entity_id: "{{ target }}"
              - alias: "Hold: favourite (+ optional announce)"
                conditions: "{{ gesture == 'hold' }}"
                sequence:
                  # Echo guard: a hold arriving while a previous hold's
                  # window is still open is the firmware's double echo
                  # (or a re-press mid-gesture), not a new press — the
                  # first waiter already owns this gesture. This also
                  # replaces the old `this.last_triggered` debounce,
                  # which misfired whenever ANY trigger (e.g. a rotation)
                  # had fired recently, swallowing real favourites.
                  - alias: Skip firmware double-echoes and mid-gesture re-presses
                    condition: template
                    value_template: "{{ not is_state(latch, 'on') or (now() - states[latch].last_changed).total_seconds() > (win_secs | float) }}"
                  - alias: Arm the seek latch
                    action: input_boolean.turn_on
                    target:
                      entity_id: "{{ latch }}"
                  # Look back as well as forward: press-and-rotate sends
                  # its turns BEFORE the knob's ~3 s hold threshold fires,
                  # so a forward-only watch always misses them and every
                  # long seek ends in a favourite. If a turn landed within
                  # the window just before this hold, the music already
                  # seeked (or the volume already moved) — disarm and stop:
                  # no wait, no favourite.
                  - alias: Skip when turns just preceded (seek, not favourite)
                    choose:
                      - conditions: "{{ turn_ts > 0 and (as_timestamp(now()) - turn_ts) < (win_secs | float) }}"
                        sequence:
                          - alias: Disarm the seek latch
                            action: input_boolean.turn_off
                            target:
                              entity_id: "{{ latch }}"
                          - alias: Stop, the turns already landed
                            condition: template
                            value_template: "{{ false }}"
                  # A hold arriving just after a favourite landed is the
                  # same finger still down (hue_move repeats while held),
                  # not a new press: the first waiter already favourited
                  # and announced. Without this, every window-length of
                  # continued holding favourites and announces again, each
                  # announcement later than the last.
                  - alias: Skip when a favourite just landed (continued hold, not a new press)
                    choose:
                      - conditions: >-
                          {% set fav = device_entities(device_id(target)) | select('search', 'favou?r') | list | first %}
                          {{ fav and (as_timestamp(now()) - as_timestamp(states[fav].last_changed, 0)) < (win_secs | float) }}
                        sequence:
                          - alias: Disarm the seek latch
                            action: input_boolean.turn_off
                            target:
                              entity_id: "{{ latch }}"
                          - alias: Stop, the favourite already landed
                            condition: template
                            value_template: "{{ false }}"
                  # Own the whole press: if a turn follows within the
                  # window this was a seek (the rotation runs already
                  # seeked via the latch) — suppress the favourite.
                  - alias: Wait to see if a turn follows (seek) or not (favourite)
                    wait_for_trigger:
                      - trigger: mqtt
                        topic: !input knob_action_topic
                        payload: rotate_right
                      - trigger: mqtt
                        topic: !input knob_action_topic
                        payload: rotate_left
                      - trigger: mqtt
                        topic: !input knob_action_topic
                        payload: color_temperature_step_up
                      - trigger: mqtt
                        topic: !input knob_action_topic
                        payload: color_temperature_step_down
                    timeout: !input seek_window
                    continue_on_timeout: true
                  - alias: Disarm the seek latch
                    action: input_boolean.turn_off
                    target:
                      entity_id: "{{ latch }}"
                  - alias: Favourite only when no turn followed
                    condition: template
                    value_template: "{{ not wait.completed }}"
                  # Favourite via the MA integration's per-player button,
                  # resolved generically through the target's device — no
                  # hardcoded button entity id to maintain. The search
                  # covers both US `favorite` and UK `favourite`
                  # spellings (`search` takes a regex, `?` makes the
                  # `u` optional).
                  - alias: Press the player's favourite button
                    action: button.press
                    target:
                      entity_id: "{{ device_entities(device_id(target)) | select('search', 'favou?r') | list | first }}"
                  # Optional announce: the message ships prefilled and
                  # generic ({song}/{artist} become track/artist); it talks
                  # once a voice is picked, on the picked speaker or the
                  # knob's current one. Goes through MA's own announcement
                  # service with the pre-announce chime explicitly OFF —
                  # tts.speak routes through the same playback but always
                  # plays MA's chime first.
                  - alias: Announce the favourite (optional)
                    choose:
                      - conditions: "{{ announce_msg and announce_voice and target != 'none' }}"
                        sequence:
                          # Never let a voice problem abort the gesture —
                          # the favourite has already landed by now.
                          # Custom speed still uses the HA voice path (only
                          # tts.speak passes length_scale to Piper/Wyoming,
                          # and only for Piper/Wyoming voices — other
                          # engines such as Cloud reject length_scale, so
                          # they use the chime-free MA call at natural pace).
                          - alias: Speak the favourite confirmation
                            choose:
                              - alias: Custom speed on Piper/Wyoming (HA voice path)
                                conditions: "{{ (announce_speed | float(1)) != 1 and ('piper' in (announce_voice or '') or 'wyoming' in (announce_voice or '')) }}"
                                sequence:
                                  - action: tts.speak
                                    continue_on_error: true
                                    target:
                                      entity_id: "{{ announce_voice }}"
                                    data:
                                      media_player_entity_id: "{{ ann_speaker }}"
                                      options:
                                        length_scale: "{{ (1 / (announce_speed | float(1))) | round(3) }}"
                                      message: "{{ ann_text }}"
                            default:
                              - alias: Chime-free MA announcement
                                action: music_assistant.play_announcement
                                continue_on_error: true
                                target:
                                  entity_id: "{{ ann_speaker }}"
                                data:
                                  tts_entity_id: "{{ announce_voice }}"
                                  message: "{{ ann_text }}"
                                  use_pre_announce: false
  # Diary write-back (optional, off by default): after any successful
  # gesture, record the speaker just used so the knob finds it next
  # time everything is idle. Skipped silently without a memory helper
  # or when nothing resolved.
  - alias: "Remember the speaker for next time (optional, off by default)"
    condition: template
    value_template: "{{ remember and memory and target != 'none' }}"
  - alias: Write the speaker to memory
    action: input_text.set_value
    target:
      entity_id: "{{ memory }}"
    data:
      value: "{{ target }}"

# Parallel: rotation runs stay instant while a hold run waits out the
# seek window; the latch (not run ordering) decides seek vs volume.
# Silent when overlapping runs exceed the cap (fast spins).
mode: parallel
max: 10
max_exceeded: silent
