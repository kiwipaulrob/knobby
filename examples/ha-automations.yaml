# Append to HA automations.yaml, then Automations -> Reload (no restart).
# Replace ZIGBEE_DEVICE_ID with your button's MQTT device id and
# input_button.fav_this_song with your dashboard button (or drop it).

- id: fav_this_song_button
  alias: Favourite this song (dashboard or Zigbee button)
  triggers:
  - id: dashboard
    trigger: state
    entity_id: input_button.fav_this_song
    not_from:
    - unavailable
    - unknown
    not_to:
    - unavailable
    - unknown
  - id: single
    trigger: device
    device_id: ZIGBEE_DEVICE_ID
    domain: mqtt
    type: action
    subtype: single
  - id: hold
    trigger: device
    device_id: ZIGBEE_DEVICE_ID
    domain: mqtt
    type: action
    subtype: hold
  - id: double
    trigger: device
    device_id: ZIGBEE_DEVICE_ID
    domain: mqtt
    type: action
    subtype: double
  actions:
  - action: rest_command.ma_fav_button
    data:
      source: '{{ trigger.id }}'
  mode: single

# --- PARKED EXPERIMENT: lean-to-adjust volume (Tuya TS0601 vibration
# sensor). Left here as documentation of the trigger shapes tried; the
# relay-side settle-and-classify loop (LEAN_ENABLE) owns the logic and
# is currently dormant. Enable only if you revive the experiment.
- id: lean_volume_control
  alias: Lean volume control (vibration sensor)
  triggers:
  - id: lean_down
    trigger: numeric_state
    entity_id: sensor.volume_x
    below: 100
    for: "00:00:04"
  - id: lean_up
    trigger: numeric_state
    entity_id: sensor.volume_y
    above: 15
    for: "00:00:04"
  conditions:
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: trigger
        id: lean_down
      - condition: numeric_state
        entity_id: sensor.volume_y
        below: 8
    - condition: and
      conditions:
      - condition: trigger
        id: lean_up
      - condition: numeric_state
        entity_id: sensor.volume_x
        above: 200
  actions:
  - action: rest_command.ma_fav_button
    data:
      source: '{{ trigger.id }}'
  mode: single

# YLKG08YL dimmer -> volume on the active MA player (rotate, step-scaled),
# play/pause (press), favourite+voice (long press). Mode queued serialises
# rapid spins so read-modify-write volume steps never race.
- id: dimmer_rotary_control
  alias: Dimmer rotary control (YLKG08YL)
  triggers:
  - trigger: state
    entity_id: event.YOUR_DIMMER_EVENT_ENTITY
    not_from:
    - unavailable
    - unknown
    not_to:
    - unavailable
    - unknown
  actions:
  - action: rest_command.ma_dimmer
    data:
      event_type: "{{ trigger.to_state.attributes.event_type }}"
      steps: "{{ trigger.to_state.attributes.steps | default(1) }}"
  mode: queued
  max: 10

# HOBEIAN ZG-101ZD Zigbee knob -> volume + seek on the active MA player.
# The knob hardware separates the gestures itself: plain turns publish
# brightness_step_up/down, turns WHILE HELD publish
# color_temperature_step_up/down, a press publishes toggle, a double-press
# publishes double, and a bare hold publishes hue_move (twice per hold).
# Replace KNOB_ACTION_TOPIC with the knob's Z2M action topic.
- id: knob_rotary_control
  alias: Knob rotary control (HOBEIAN ZG-101ZD)
  triggers:
  - trigger: mqtt
    topic: KNOB_ACTION_TOPIC
  variables:
    event_map:
      brightness_step_up: rotate_right
      brightness_step_down: rotate_left
      toggle: press
      double: rotate_right_pressed
      color_temperature_step_down: seek_back
      color_temperature_step_up: seek_fwd
  conditions:
  - condition: template
    value_template: '{{ trigger.payload in event_map }}'
  actions:
  - action: rest_command.ma_dimmer
    data:
      event_type: '{{ event_map[trigger.payload] }}'
      steps: 1
  mode: queued
  max: 10

# Knob hold -> favourite + voice. The knob emits hue_move twice per hold,
# so the 10 s self-last_triggered guard debounces the echo. Replace the
# automation entity id in the guard with your own alias's slugified id
# (HA builds it from the ALIAS, not the id: field).
- id: knob_hold_fav
  alias: Knob hold for favourite (HOBEIAN ZG-101ZD)
  triggers:
  - trigger: mqtt
    topic: KNOB_ACTION_TOPIC
    payload: hue_move
  conditions:
  - condition: template
    value_template: "{{ state_attr('automation.knob_hold_for_favourite_hobeian_zg_101zd','last_triggered') is none\n  or (now() - state_attr('automation.knob_hold_for_favourite_hobeian_zg_101zd','last_triggered')).total_seconds() > 10 }}"
  actions:
  - action: rest_command.ma_dimmer
    data:
      event_type: long_press
      steps: 1
  mode: single
