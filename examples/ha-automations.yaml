# Append to HA automations.yaml, then Automations -> Reload (no restart).
# Replace ZIGBEE_DEVICE_ID with your button's MQTT device id and
# input_button.fav_this_song with your dashboard button (or drop it).

- id: fav_this_song_button
  alias: Favourite this song (dashboard or Zigbee button)
  triggers:
  - id: dashboard
    trigger: state
    entity_id: input_button.fav_this_song
    not_from:
    - unavailable
    - unknown
    not_to:
    - unavailable
    - unknown
  - id: single
    trigger: device
    device_id: ZIGBEE_DEVICE_ID
    domain: mqtt
    type: action
    subtype: single
  - id: hold
    trigger: device
    device_id: ZIGBEE_DEVICE_ID
    domain: mqtt
    type: action
    subtype: hold
  - id: double
    trigger: device
    device_id: ZIGBEE_DEVICE_ID
    domain: mqtt
    type: action
    subtype: double
  actions:
  - action: rest_command.ma_fav_button
    data:
      source: '{{ trigger.id }}'
  mode: single

# --- PARKED EXPERIMENT: lean-to-adjust volume (Tuya TS0601 vibration
# sensor). Left here as documentation of the trigger shapes tried; the
# relay-side settle-and-classify loop (LEAN_ENABLE) owns the logic and
# is currently dormant. Enable only if you revive the experiment.
- id: lean_volume_control
  alias: Lean volume control (vibration sensor)
  triggers:
  - id: lean_down
    trigger: numeric_state
    entity_id: sensor.volume_x
    below: 100
    for: "00:00:04"
  - id: lean_up
    trigger: numeric_state
    entity_id: sensor.volume_y
    above: 15
    for: "00:00:04"
  conditions:
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: trigger
        id: lean_down
      - condition: numeric_state
        entity_id: sensor.volume_y
        below: 8
    - condition: and
      conditions:
      - condition: trigger
        id: lean_up
      - condition: numeric_state
        entity_id: sensor.volume_x
        above: 200
  actions:
  - action: rest_command.ma_fav_button
    data:
      source: '{{ trigger.id }}'
  mode: single

# YLKG08YL dimmer -> volume on the active MA player (rotate, step-scaled),
# play/pause (press), favourite+voice (long press). Mode queued serialises
# rapid spins so read-modify-write volume steps never race.
- id: dimmer_rotary_control
  alias: Dimmer rotary control (YLKG08YL)
  triggers:
  - trigger: state
    entity_id: event.YOUR_DIMMER_EVENT_ENTITY
    not_from:
    - unavailable
    - unknown
    not_to:
    - unavailable
    - unknown
  actions:
  - action: rest_command.ma_dimmer
    data:
      event_type: "{{ trigger.to_state.attributes.event_type }}"
      steps: "{{ trigger.to_state.attributes.steps | default(1) }}"
  mode: queued
  max: 10

# HOBEIAN ZG-101ZD Zigbee knob -> volume + seek on the active MA player.
# Mode-oscillation warning (verified Nov 2026): every deliberate triple-press
# TOGGLES the knob's operation_mode (event<->command) and remote mode-set does
# not land on this firmware, so the knob drifts between two vocabularies.
# Event mode speaks rotate_right/rotate_left/single/double/hold; command mode
# speaks brightness_step_up/down, toggle, double, hue_move (+hue_stop). The map
# keys BOTH so the knob stays usable in either mode. Event-mode press-and-turn
# is firmware-indistinguishable from volume+hold (plain rotates + a hold once
# the press outlasts the threshold), so seek vs favourite is disambiguated by
# gesture shape via the two automations' last_triggered timestamps (see the
# hold automation below). Replace KNOB_ACTION_TOPIC with the knob's Z2M action
# topic.
- id: knob_rotary_control
  alias: Knob rotary control (HOBEIAN ZG-101ZD)
  triggers:
  - trigger: mqtt
    topic: KNOB_ACTION_TOPIC
  variables:
    event_map:
      rotate_right: rotate_right
      rotate_left: rotate_left
      single: press
      double: rotate_right_pressed
      brightness_step_up: rotate_right
      brightness_step_down: rotate_left
      toggle: press
      color_temperature_step_down: seek_back
      color_temperature_step_up: seek_fwd
  conditions:
  - condition: template
    value_template: '{{ trigger.payload in event_map }}'
  actions:
  - action: rest_command.ma_dimmer
    data:
      event_type: >
        {% set h = state_attr('automation.knob_hold_for_favourite_hobeian_zg_101zd','last_triggered') %}
        {% set seeking = h is not none and (now() - h).total_seconds() < 2 %}
        {% if seeking and trigger.payload == 'rotate_right' %}seek_fwd
        {% elif seeking and trigger.payload == 'rotate_left' %}seek_back
        {% else %}{{ event_map[trigger.payload] }}{% endif %}
      steps: 1
  mode: queued
  max: 10

# Knob hold -> favourite + voice, committed 2 s after the hold so a
# press-and-turn (seek) can suppress it: the post-delay condition only commits
# if the rotary automation has NOT fired since ~1 s before the hold (rotation
# before or during the hold means it was a seek). The 10 s self-last_triggered
# guard debounces the bare-hold double echo. Replace both automation entity
# ids with your own aliases' slugified ids (HA builds them from the ALIAS,
# not the id: field). The hold automation also fires in command mode (on
# hue_move); command-mode press-and-turn seeks natively via
# color_temperature_step_up/down.
- id: knob_hold_fav
  alias: Knob hold for favourite (HOBEIAN ZG-101ZD)
  triggers:
  - trigger: mqtt
    topic: KNOB_ACTION_TOPIC
    payload: hue_move
  - trigger: mqtt
    topic: KNOB_ACTION_TOPIC
    payload: hold
  conditions:
  - condition: template
    value_template: "{{ state_attr('automation.knob_hold_for_favourite_hobeian_zg_101zd','last_triggered') is none\n  or (now() - state_attr('automation.knob_hold_for_favourite_hobeian_zg_101zd','last_triggered')).total_seconds() > 10 }}"
  actions:
  - delay: "00:00:02"
  - condition: template
    value_template: >
      {% set r = state_attr('automation.knob_rotary_control_hobeian_zg_101zd','last_triggered') %}
      {% set h = state_attr('automation.knob_hold_for_favourite_hobeian_zg_101zd','last_triggered') %}
      {{ r is none or h is none or (r < h - timedelta(seconds=1)) }}
  - action: rest_command.ma_dimmer
    data:
      event_type: long_press
      steps: 1
  mode: single

# Knob triple-press -> previous track (dual-edge mode-flip proxy, Nov 2026).
# A deliberate triple emits NO action, only an operation_mode event<->command
# flip in BOTH directions (a fast triple parses as double). Firing on BOTH
# select edges catches every triple from either mode with no restore attempt
# (remote mode-set does not land on this firmware). MA treats a lone previous
# as restart-current, so the proxy fires twice ~2 s apart: the first
# restarts, the second steps back. Replace KNOB_OPERATION_MODE_SELECT with
# the Z2M operation_mode select entity for your knob.
- id: knob_triple_click_proxy
  alias: Knob triple-click for previous track (dual-edge mode-flip detect)
  description: Triple-press emits no MQTT action but toggles operation_mode
    event<->command. Firing on BOTH select edges gives a reliable triple-click
    (previous track) from either mode; no remote mode-set is attempted.
  triggers:
  - trigger: state
    entity_id: select.KNOB_OPERATION_MODE_SELECT
    from: event
    to: command
    id: triple
  - trigger: state
    entity_id: select.KNOB_OPERATION_MODE_SELECT
    from: command
    to: event
    id: triple_rev
  conditions: []
  actions:
  - action: rest_command.ma_dimmer
    data:
      event_type: rotate_left_pressed
      steps: 1
  - delay: "00:00:02"
  - action: rest_command.ma_dimmer
    data:
      event_type: rotate_left_pressed
      steps: 1
  mode: single
