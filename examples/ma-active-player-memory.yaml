# Memory keeper for the native knob blueprint
# (blueprints/automation/kiwipaulrob/zg101zd_knob_ma_native.yaml).
#
# Import/run once. It watches the playing SET of your speaker group, so it
# catches speaker A -> speaker B handoffs that a plain "became playing"
# trigger misses. The knob blueprint reads input_text.ma_active_player
# to resolve its target each press; the value survives HA restarts.
#
# Prerequisites (Settings -> Devices & services -> Helpers, exact names):
#   - group.ma_speakers: group helper with your MA speaker media_players
#     (no TVs, no dashboard displays)
#   - input_text.ma_active_player: text helper, max length 255
alias: MA active player memory
trigger:
  - platform: template
    value_template: >
      {{ expand('group.ma_speakers')
         | selectattr('state','eq','playing')
         | map(attribute='entity_id') | sort | join(',') }}
condition:
  - condition: template
    value_template: >
      {{ expand('group.ma_speakers')
         | selectattr('state','eq','playing') | list | count > 0 }}
action:
  - action: input_text.set_value
    target:
      entity_id: input_text.ma_active_player
    data:
      value: >
        {{ (expand('group.ma_speakers') | selectattr('state','eq','playing')
            | map(attribute='entity_id') | sort)[0] }}
mode: single
